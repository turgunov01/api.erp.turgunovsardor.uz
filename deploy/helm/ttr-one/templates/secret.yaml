{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ttr-one.secretName" . }}
  labels:
    {{- include "ttr-one.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  JWT_SECRET: {{ .Values.secret.jwtSecret | quote }}
  SECRET_KEY: {{ .Values.secret.secretKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secret.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secret.openaiApiKey | quote }}
  SMTP_URL: {{ .Values.secret.smtpUrl | quote }}
  TELEGRAM_BOT_TOKEN: {{ .Values.secret.telegramBotToken | quote }}
{{- end }}
