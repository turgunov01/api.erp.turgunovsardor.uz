# =====================================================================
#  api.erp.turgunovsardor.uz  →  TTR ONE backend (Node/Fastify on :9990)
# =====================================================================

# --- HTTP: ACME challenge + permanent redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name api.erp.turgunovsardor.uz;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# --- HTTPS: reverse proxy to the API ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.erp.turgunovsardor.uz;

    ssl_certificate     /etc/letsencrypt/live/erp.turgunovsardor.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.turgunovsardor.uz/privkey.pem;
    include /etc/nginx/snippets/ttr-ssl.conf;
    include /etc/nginx/snippets/ttr-security.conf;

    # Uploads / xlsx exports; keep modest to blunt large-payload abuse.
    client_max_body_size 25m;
    limit_conn ttr_conn 50;

    # CORS is handled by the API itself (CORS_ORIGINS allowlist) — do NOT add it here too.

    # Tighter limit on auth endpoints (brute-force surface).
    location ~ ^/api/v1/auth/(login|register|refresh|password) {
        limit_req zone=ttr_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:9990;
        include /etc/nginx/snippets/ttr-proxy.conf;
    }

    location / {
        limit_req zone=ttr_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:9990;
        include /etc/nginx/snippets/ttr-proxy.conf;
    }
}
