# =====================================================================
#  erp.turgunovsardor.uz  →  TTR ONE frontend (Nuxt SPA, static build)
#  Served straight from disk: /var/www/erp  (output of `nuxt generate`)
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name erp.turgunovsardor.uz;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erp.turgunovsardor.uz;

    ssl_certificate     /etc/letsencrypt/live/erp.turgunovsardor.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.turgunovsardor.uz/privkey.pem;
    include /etc/nginx/snippets/ttr-ssl.conf;
    include /etc/nginx/snippets/ttr-security.conf;

    root /var/www/erp;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable → cache hard (uses `expires`, not add_header,
    # so the inherited security headers are preserved in this location).
    location /_nuxt/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback: Nuxt (ssr:false) emits 200.html as the catch-all shell.
    location / {
        try_files $uri $uri/ /200.html;
    }
}
