# Rate-limit zones (must live in the http{} context → dropped into /etc/nginx/conf.d/).
# api:  general API traffic, 20 req/s per IP with a small burst.
# auth: login / refresh / register — brute-force sensitive, tighter.
limit_req_zone  $binary_remote_addr  zone=ttr_api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr  zone=ttr_auth:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr  zone=ttr_conn:10m;
