# =====================================================================
#  docs.erp.turgunovsardor.uz  →  Developer docs (Nuxt Content, prerendered)
#  Served from /var/www/docs.erp.turgunovsardor.uz/.output/public
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name docs.erp.turgunovsardor.uz;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.erp.turgunovsardor.uz;

    ssl_certificate     /etc/letsencrypt/live/erp.turgunovsardor.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.turgunovsardor.uz/privkey.pem;
    include /etc/nginx/snippets/ttr-ssl.conf;
    include /etc/nginx/snippets/ttr-security.conf;

    root /var/www/docs.erp.turgunovsardor.uz/.output/public;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /_nuxt/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Root of the docs site redirects to the default locale (see app.vue → /ru).
    # Prerendered content pages resolve to <path>.html or <path>/index.html.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
