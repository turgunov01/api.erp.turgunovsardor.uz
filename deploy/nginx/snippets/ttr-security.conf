# Shared response-security headers. Included by every site server block.
# NOTE: nginx only inherits add_header into a location that declares NO add_header of
# its own. Static sites therefore use `expires`/`try_files` (not add_header) for caching
# so these security headers survive into every location.
add_header X-Content-Type-Options   "nosniff"                        always;
add_header X-Frame-Options           "SAMEORIGIN"                     always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
add_header X-XSS-Protection          "0"                              always;
add_header Cross-Origin-Opener-Policy "same-origin"                   always;

# Never leak nginx/backend version.
server_tokens off;
