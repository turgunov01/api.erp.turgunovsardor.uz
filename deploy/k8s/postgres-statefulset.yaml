apiVersion: v1
kind: Service
metadata:
  name: ttr-one-postgres
  namespace: ttr-one
  labels:
    app.kubernetes.io/part-of: ttr-one
    app.kubernetes.io/component: postgres
spec:
  # Headless service — stable network id for the StatefulSet.
  clusterIP: None
  selector:
    app.kubernetes.io/name: ttr-one-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ttr-one-postgres
  namespace: ttr-one
  labels:
    app.kubernetes.io/part-of: ttr-one
    app.kubernetes.io/component: postgres
spec:
  serviceName: ttr-one-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ttr-one-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ttr-one-postgres
        app.kubernetes.io/part-of: ttr-one
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "ttr"
            - name: POSTGRES_DB
              value: "ttr_one"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ttr-one-secrets
                  key: POSTGRES_PASSWORD
            # Point Postgres at a subdir so the PVC root (lost+found) is not the datadir.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U ttr -d ttr_one"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U ttr -d ttr_one"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
