apiVersion: v1
kind: Service
metadata:
  name: ttr-one-web
  namespace: ttr-one
  labels:
    app.kubernetes.io/part-of: ttr-one
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ttr-one-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ttr-one-web
  namespace: ttr-one
  labels:
    app.kubernetes.io/part-of: ttr-one
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ttr-one-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ttr-one-web
        app.kubernetes.io/part-of: ttr-one
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          # Image is built with NUXT_PUBLIC_API_BASE baked in (see web/Dockerfile).
          image: ghcr.io/ttr-one/web:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
