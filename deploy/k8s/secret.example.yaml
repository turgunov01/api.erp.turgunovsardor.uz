# Example Secret — DO NOT commit real values. Create the real one out-of-band, e.g.:
#   kubectl -n ttr-one create secret generic ttr-one-secrets \
#     --from-literal=DATABASE_URL='postgresql://ttr:PASS@ttr-one-postgres:5432/ttr_one?schema=public' \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD='PASS'
apiVersion: v1
kind: Secret
metadata:
  name: ttr-one-secrets
  namespace: ttr-one
  labels:
    app.kubernetes.io/part-of: ttr-one
type: Opaque
stringData:
  # Consumed by the API. Host `ttr-one-postgres` is the StatefulSet service.
  DATABASE_URL: "postgresql://ttr:change-me@ttr-one-postgres:5432/ttr_one?schema=public"
  JWT_SECRET: "change-me-min-16-chars-use-openssl-rand-hex-32"
  SECRET_KEY: "change-me-another-openssl-rand-hex-32"
  # Consumed by the Postgres StatefulSet.
  POSTGRES_PASSWORD: "change-me"
  # Optional integrations.
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  SMTP_URL: ""
  TELEGRAM_BOT_TOKEN: ""
