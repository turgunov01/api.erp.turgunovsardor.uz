apiVersion: v1
kind: Service
metadata:
  name: ttr-one-api
  namespace: ttr-one
  labels:
    app.kubernetes.io/part-of: ttr-one
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ttr-one-api
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ttr-one-api
  namespace: ttr-one
  labels:
    app.kubernetes.io/part-of: ttr-one
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ttr-one-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ttr-one-api
        app.kubernetes.io/part-of: ttr-one
        app.kubernetes.io/component: api
    spec:
      # Apply DB migrations before any API pod serves traffic.
      initContainers:
        - name: migrate
          image: ghcr.io/ttr-one/api:latest
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - configMapRef:
                name: ttr-one-config
            - secretRef:
                name: ttr-one-secrets
      containers:
        - name: api
          image: ghcr.io/ttr-one/api:latest
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: ttr-one-config
            - secretRef:
                name: ttr-one-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
