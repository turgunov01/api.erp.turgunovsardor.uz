apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ttr-one
  namespace: ttr-one
  labels:
    app.kubernetes.io/part-of: ttr-one
  annotations:
    kubernetes.io/ingress.class: nginx
    # TLS via cert-manager (optional — remove if you terminate TLS elsewhere).
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.ttr-one.example.com
      secretName: ttr-one-tls
  rules:
    - host: app.ttr-one.example.com
      http:
        paths:
          # API + health endpoints go to the API service.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ttr-one-api
                port:
                  number: 3000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: ttr-one-api
                port:
                  number: 3000
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: ttr-one-api
                port:
                  number: 3000
          # Everything else is the SPA (landing + app).
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ttr-one-web
                port:
                  number: 80
