openapi: 3.0.3
info:
  title: TTR ONE — ERP Platform API
  version: 0.1.0
  description: |
    REST API for **TTR ONE**, a multi-tenant SaaS ERP for Uzbekistan
    (Node/Fastify + PostgreSQL/Prisma backend, Nuxt 3 SPA frontend).

    ## Conventions
    - **Base URL**: all endpoints live under `/api/v1`.
    - **Auth**: JWT Bearer. Obtain an `accessToken` from `POST /auth/login`
      (15-minute TTL) and rotate it via `POST /auth/refresh`.
    - **Money**: all monetary amounts are integers in **minor units (tiyin)**,
      e.g. `1 000 000` = 10 000.00 UZS. Fields end in `Minor`.
    - **Quantities**: decimal strings, bounded to 6 decimal places.
    - **Multi-tenancy**: every record is scoped to the caller's tenant
      (derived from the token); there is no tenant id in the path.
    - **Errors**: uniform envelope `{ "error": { "code": "...", "message": "..." } }`.
    - **Pagination**: list endpoints accept `page`, `pageSize` (max 200),
      `sort`, `order` (`asc`/`desc`), `search`, and return a `meta` object
      `{ page, pageSize, total, totalPages }`.
  contact:
    name: TTR ONE
servers:
  - url: http://localhost:3000/api/v1
    description: Local development

security:
  - apiKeyAuth: []
  - bearerAuth: []

tags:
  - name: auth
    description: Authentication, registration, MFA, PIN, sessions
  - name: org
    description: Companies and branches
  - name: catalog
    description: Units, categories, products, barcodes
  - name: warehouse
    description: Warehouses, on-hand stock, movement ledger, transfers
  - name: inventory
    description: Bin locations, counts, batches, serials, reorder rules
  - name: procurement
    description: Suppliers, prices, requests, purchase orders, receipts, invoices
  - name: sales
    description: Customers, price lists, quotations, orders, shipments, returns
  - name: crm
    description: Deals and sales funnel
  - name: production
    description: Bills of materials and production orders
  - name: finance
    description: Cash/bank accounts, chart of accounts, journal, reports, VAT
  - name: analytics
    description: KPIs, series, tabular reports, export, forecast
  - name: ai
    description: AI assistant, invoice OCR, AI settings
  - name: studio
    description: Marketplace, integrations, no-code forms
  - name: platform
    description: Notifications, search, files, jobs, tenders, realtime
  - name: documents
    description: Templates, documents, versions, approval chain
  - name: tenant
    description: Tenant settings, branding, module toggles
  - name: billing
    description: Plans, subscription, invoices, payment
  - name: admin
    description: Users, roles, invitations, audit

paths:
  # ==================== AUTH ====================
  /auth/register:
    post:
      tags: [auth]
      summary: Self-registration — create a tenant + owner and log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Tenant created and session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email + password (optional tenant slug and MFA code)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token for a new access + refresh pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke all refresh tokens for the current user
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/me:
    get:
      tags: [auth]
      summary: Current authenticated user + permissions
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/change-password:
    post:
      tags: [auth]
      summary: Change password (invalidates all sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password-reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                tenant: { type: string }
      responses:
        '200':
          description: Always ok (does not reveal whether the email exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  devResetToken: { type: string, description: Dev only }
  /auth/reset-password:
    post:
      tags: [auth]
      summary: Set a new password using a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/mfa/setup:
    post:
      tags: [auth]
      summary: Begin TOTP MFA enrolment — returns a secret + otpauth URL
      responses:
        '200':
          description: Pending MFA secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  otpauth: { type: string }
  /auth/mfa/enable:
    post:
      tags: [auth]
      summary: Confirm and enable MFA with a TOTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/pin/set:
    post:
      tags: [auth]
      summary: Set a 4–8 digit mobile PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pin]
              properties: { pin: { type: string, pattern: '^\d{4,8}$' } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/sessions:
    get:
      tags: [auth]
      summary: List active sessions/devices
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        userAgent: { type: string, nullable: true }
                        ip: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }

  # ==================== ORG ====================
  /org/companies:
    get:
      tags: [org]
      summary: List companies
      responses:
        '200':
          description: Companies
          content:
            application/json:
              schema:
                type: object
                properties:
                  companies:
                    type: array
                    items: { type: object }
    post:
      tags: [org]
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string }
                code: { type: string }
                legalName: { type: string }
                taxId: { type: string }
                currency: { type: string, default: UZS }
      responses:
        '201': { description: Created }
  /org/branches:
    get:
      tags: [org]
      summary: List branches
      responses:
        '200': { description: Branches }
    post:
      tags: [org]
      summary: Create a branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId, name, code]
              properties:
                companyId: { type: string }
                name: { type: string }
                code: { type: string }
                address: { type: string }
      responses:
        '201': { description: Created }

  # ==================== CATALOG ====================
  /catalog/products:
    get:
      tags: [catalog]
      summary: List products (paginated, searchable, sortable)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/order'
        - $ref: '#/components/parameters/search'
      responses:
        '200':
          description: Products
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
                  priceVisible: { type: boolean }
    post:
      tags: [catalog]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: '#/components/schemas/Product' }
        '409': { $ref: '#/components/responses/Conflict' }
  /catalog/products/{id}:
    patch:
      tags: [catalog]
      summary: Update a product (SKU immutable)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
  /catalog/products/{id}/barcode:
    post:
      tags: [catalog]
      summary: Generate a unique EAN-13 barcode for a product
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Product with barcode }
  /catalog/products/by-barcode/{code}:
    get:
      tags: [catalog]
      summary: Look up a product by barcode (scan)
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Product }
        '404': { $ref: '#/components/responses/NotFound' }
  /catalog/units:
    get:
      tags: [catalog]
      summary: List units of measure
      responses: { '200': { description: Units } }
    post:
      tags: [catalog]
      summary: Create a unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string }
                code: { type: string }
                precision: { type: integer, default: 0 }
      responses: { '201': { description: Created } }
  /catalog/categories:
    get:
      tags: [catalog]
      summary: List categories
      responses: { '200': { description: Categories } }
    post:
      tags: [catalog]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string }
                code: { type: string }
                parentId: { type: string }
      responses: { '201': { description: Created } }

  # ==================== WAREHOUSE ====================
  /warehouse/warehouses:
    get:
      tags: [warehouse]
      summary: List warehouses (record-level scoped)
      responses: { '200': { description: Warehouses } }
    post:
      tags: [warehouse]
      summary: Create a warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string }
                code: { type: string }
                companyId: { type: string }
                address: { type: string }
      responses: { '201': { description: Created } }
  /warehouse/stock:
    get:
      tags: [warehouse]
      summary: On-hand stock per (warehouse, product)
      parameters:
        - name: warehouseId
          in: query
          schema: { type: string }
        - name: lowOnly
          in: query
          description: '"1" filters to items with available <= 0'
          schema: { type: string }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Stock rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  stock:
                    type: array
                    items: { $ref: '#/components/schemas/StockRow' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
  /warehouse/movements:
    get:
      tags: [warehouse]
      summary: Movement ledger (filter by warehouse/product/type)
      parameters:
        - name: warehouseId
          in: query
          schema: { type: string }
        - name: productId
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [IN, OUT, ADJUST, TRANSFER_IN, TRANSFER_OUT, RECEIPT] }
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200': { description: Movements }
    post:
      tags: [warehouse]
      summary: Perform a stock movement (receive / issue / adjust)
      description: >
        `IN`/`OUT` use a positive quantity; `ADJUST` sets the absolute on-hand.
        Over-issue returns `INSUFFICIENT_STOCK`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, productId, type, quantity]
              properties:
                warehouseId: { type: string }
                productId: { type: string }
                type: { type: string, enum: [IN, OUT, ADJUST] }
                quantity: { type: number }
                reason: { type: string }
      responses:
        '201': { description: Movement recorded }
        '400': { $ref: '#/components/responses/ValidationError' }
  /warehouse/transfer:
    post:
      tags: [warehouse]
      summary: Transfer stock between warehouses (atomic OUT + IN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromWarehouseId, toWarehouseId, productId, quantity]
              properties:
                fromWarehouseId: { type: string }
                toWarehouseId: { type: string }
                productId: { type: string }
                quantity: { type: number }
                reason: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Ok' }

  # ==================== INVENTORY (WMS) ====================
  /inventory/locations:
    get:
      tags: [inventory]
      summary: List bin locations
      responses: { '200': { description: Locations } }
    post:
      tags: [inventory]
      summary: Create a bin location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, code, name]
              properties:
                warehouseId: { type: string }
                code: { type: string }
                name: { type: string }
                kind: { type: string, enum: [zone, rack, shelf, bin], default: bin }
      responses: { '201': { description: Created } }
  /inventory/counts:
    get:
      tags: [inventory]
      summary: List inventory counts
      responses: { '200': { description: Counts } }
    post:
      tags: [inventory]
      summary: Start an inventory count for a warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId]
              properties:
                warehouseId: { type: string }
                note: { type: string }
      responses: { '201': { description: Created } }
  /inventory/counts/{id}/complete:
    post:
      tags: [inventory]
      summary: Complete a count and post variances as ADJUST movements
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /inventory/batches/receive:
    post:
      tags: [inventory]
      summary: Receive a batch/lot with an expiry date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, productId, batchNo, quantity]
              properties:
                warehouseId: { type: string }
                productId: { type: string }
                batchNo: { type: string }
                expiryDate: { type: string, format: date }
                quantity: { type: number }
      responses: { '201': { description: Created } }
  /inventory/batches/expiring:
    get:
      tags: [inventory]
      summary: Batches expiring within a window
      parameters:
        - name: days
          in: query
          schema: { type: integer }
      responses: { '200': { description: Expiring batches } }
  /inventory/low-stock:
    get:
      tags: [inventory]
      summary: Items below their reorder point
      responses: { '200': { description: Low-stock items } }
  /inventory/reorder/auto-request:
    post:
      tags: [inventory]
      summary: Auto-generate a purchase request from low stock
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                warehouseId: { type: string }
                note: { type: string }
      responses: { '201': { description: Purchase request created } }

  # ==================== PROCUREMENT ====================
  /procurement/suppliers:
    get:
      tags: [procurement]
      summary: List suppliers (paginated/searchable)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/search'
      responses: { '200': { description: Suppliers } }
    post:
      tags: [procurement]
      summary: Create a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyInput' }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/ValidationError' }
  /procurement/compare:
    get:
      tags: [procurement]
      summary: Compare supplier offers for a product (cheapest first)
      parameters:
        - name: productId
          in: query
          required: true
          schema: { type: string }
      responses: { '200': { description: Ranked offers } }
  /procurement/requests:
    get:
      tags: [procurement]
      summary: List purchase requests
      responses: { '200': { description: Requests } }
    post:
      tags: [procurement]
      summary: Create a purchase request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                note: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: { type: string }
                      quantity: { type: number }
      responses: { '201': { description: Created } }
  /procurement/requests/{id}/approve:
    post:
      tags: [procurement]
      summary: Approve a purchase request
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /procurement/requests/{id}/convert:
    post:
      tags: [procurement]
      summary: Convert an approved request into a purchase order
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId]
              properties:
                supplierId: { type: string }
                warehouseId: { type: string }
                prices:
                  type: object
                  additionalProperties: { type: integer }
      responses: { '201': { description: Purchase order created } }
  /procurement/orders:
    get:
      tags: [procurement]
      summary: List purchase orders
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/page'
      responses: { '200': { description: Purchase orders } }
    post:
      tags: [procurement]
      summary: Create a purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId, items]
              properties:
                supplierId: { type: string }
                warehouseId: { type: string }
                expectedAt: { type: string, format: date }
                note: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: { type: string }
                      quantity: { type: number }
                      priceMinor: { type: integer }
      responses: { '201': { description: Created } }
  /procurement/orders/{id}:
    get:
      tags: [procurement]
      summary: Purchase order detail (items, receipts, invoices)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Order }
        '404': { $ref: '#/components/responses/NotFound' }
  /procurement/orders/{id}/send:
    post:
      tags: [procurement]
      summary: Send a draft PO to the supplier
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /procurement/orders/{id}/receive:
    post:
      tags: [procurement]
      summary: Receive goods against a PO (stock IN + AP posting)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                warehouseId: { type: string }
                note: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: { type: string }
                      quantity: { type: number }
      responses:
        '201': { description: Goods receipt created }
        '400': { $ref: '#/components/responses/ValidationError' }
  /procurement/invoices:
    get:
      tags: [procurement]
      summary: List supplier invoices
      responses: { '200': { description: Invoices } }
    post:
      tags: [procurement]
      summary: Register a supplier invoice (runs 3-way match)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId, number, amountMinor]
              properties:
                supplierId: { type: string }
                poId: { type: string }
                number: { type: string }
                amountMinor: { type: integer }
      responses: { '201': { description: Invoice + match result } }
  /procurement/invoices/{id}/pay:
    post:
      tags: [procurement]
      summary: Mark a matched invoice as paid
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ==================== SALES ====================
  /sales/customers:
    get:
      tags: [sales]
      summary: List customers
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/search'
      responses: { '200': { description: Customers } }
    post:
      tags: [sales]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyInput' }
      responses: { '201': { description: Created } }
  /sales/quotations:
    get:
      tags: [sales]
      summary: List quotations (commercial offers)
      responses: { '200': { description: Quotations } }
    post:
      tags: [sales]
      summary: Create a quotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, items]
              properties:
                customerId: { type: string }
                note: { type: string }
                validUntil: { type: string, format: date }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/OrderLineInput' }
      responses: { '201': { description: Created } }
  /sales/quotations/{id}/convert:
    post:
      tags: [sales]
      summary: Convert an accepted quotation into a sales order
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                warehouseId: { type: string }
                expectedAt: { type: string, format: date }
      responses: { '201': { description: Sales order created } }
  /sales/orders:
    get:
      tags: [sales]
      summary: List sales orders
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/page'
      responses: { '200': { description: Orders } }
    post:
      tags: [sales]
      summary: Create a sales order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, items]
              properties:
                customerId: { type: string }
                warehouseId: { type: string }
                expectedAt: { type: string, format: date }
                note: { type: string }
                discountPct: { type: integer, default: 0 }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/OrderLineInput' }
      responses: { '201': { description: Created } }
  /sales/orders/{id}:
    get:
      tags: [sales]
      summary: Sales order detail (items, shipments, returns, totals)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Order }
        '404': { $ref: '#/components/responses/NotFound' }
  /sales/orders/{id}/confirm:
    post:
      tags: [sales]
      summary: Confirm a draft sales order
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /sales/orders/{id}/reserve:
    post:
      tags: [sales]
      summary: Reserve stock (available-to-promise) for the order
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { warehouseId: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /sales/orders/{id}/ship:
    post:
      tags: [sales]
      summary: Ship goods against the order (stock OUT + revenue/COGS postings)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                warehouseId: { type: string }
                note: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: { type: string }
                      quantity: { type: number }
      responses:
        '201': { description: Shipment created }
        '400': { $ref: '#/components/responses/ValidationError' }
  /sales/orders/{id}/cancel:
    post:
      tags: [sales]
      summary: Cancel an order (releases reservations)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /sales/returns:
    get:
      tags: [sales]
      summary: List customer returns
      responses: { '200': { description: Returns } }
    post:
      tags: [sales]
      summary: Register a customer return (stock IN + reversal postings)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId, items]
              properties:
                soId: { type: string }
                warehouseId: { type: string }
                reason: { type: string }
                note: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      productId: { type: string }
                      quantity: { type: number }
      responses: { '201': { description: Return created } }
  /sales/price-lists:
    get:
      tags: [sales]
      summary: List price lists with items
      responses: { '200': { description: Price lists } }
    post:
      tags: [sales]
      summary: Create a price list
      requestBody:
        required: true
        content:
