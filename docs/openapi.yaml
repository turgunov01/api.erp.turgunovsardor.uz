  # ==================== FINANCE ====================
  /finance/settings:
    get:
      tags: [finance]
      summary: Costing method + VAT settings
      responses: { '200': { description: Settings } }
    patch:
      tags: [finance]
      summary: Update costing method / VAT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                costingMethod: { type: string, enum: [avg, fifo] }
                vatEnabled: { type: boolean }
                vatRatePct: { type: integer }
      responses: { '200': { description: Updated } }
  /finance/accounts:
    get:
      tags: [finance]
      summary: List cash/bank accounts with total balance
      responses: { '200': { description: Accounts } }
    post:
      tags: [finance]
      summary: Create a cash/bank account (posts opening balance)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                kind: { type: string, enum: [cash, bank, card], default: cash }
                currency: { type: string, default: UZS }
                accountNo: { type: string }
                openingMinor: { type: integer, default: 0 }
      responses: { '201': { description: Created } }
  /finance/transactions:
    get:
      tags: [finance]
      summary: List cash transactions
      parameters:
        - name: accountId
          in: query
          schema: { type: string }
        - name: direction
          in: query
          schema: { type: string, enum: [in, out] }
      responses: { '200': { description: Transactions } }
    post:
      tags: [finance]
      summary: Record a receipt / payment (posts a balanced journal entry)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, direction, amountMinor]
              properties:
                accountId: { type: string }
                direction: { type: string, enum: [in, out] }
                category: { type: string, enum: [sale, purchase, salary, vat, tax, rent, utility, other, refund] }
                amountMinor: { type: integer }
                date: { type: string, format: date }
                counterparty: { type: string }
                note: { type: string }
      responses:
        '201': { description: Transaction created }
        '400': { $ref: '#/components/responses/ValidationError' }
  /finance/chart:
    get:
      tags: [finance]
      summary: Chart of accounts (auto-seeded on first read)
      responses: { '200': { description: Ledger accounts } }
    post:
      tags: [finance]
      summary: Add a ledger account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, type]
              properties:
                code: { type: string }
                name: { type: string }
                type: { type: string, enum: [asset, liability, equity, income, expense] }
      responses: { '201': { description: Created } }
  /finance/journal:
    get:
      tags: [finance]
      summary: List journal entries
      parameters:
        - name: source
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses: { '200': { description: Entries } }
    post:
      tags: [finance]
      summary: Post a manual journal entry (must balance)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                date: { type: string, format: date }
                memo: { type: string }
                lines:
                  type: array
                  minItems: 2
                  items:
                    type: object
                    properties:
                      accountCode: { type: string }
                      debitMinor: { type: integer, default: 0 }
                      creditMinor: { type: integer, default: 0 }
                      description: { type: string }
      responses: { '201': { description: Entry posted } }
  /finance/journal/{id}/reverse:
    post:
      tags: [finance]
      summary: Reverse a posted journal entry
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses: { '201': { description: Reversal posted } }
  /finance/reports/trial-balance:
    get:
      tags: [finance]
      summary: Trial balance as of a date
      parameters:
        - name: asOf
          in: query
          schema: { type: string, format: date }
      responses: { '200': { description: Trial balance } }
  /finance/reports/pnl:
    get:
      tags: [finance]
      summary: Profit & loss for a date range
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses: { '200': { description: P&L } }
  /finance/reports/inventory-valuation:
    get:
      tags: [finance]
      summary: On-hand valuation (weighted-average and FIFO)
      responses: { '200': { description: Valuation } }
  /finance/reports/vat:
    get:
      tags: [finance]
      summary: VAT (QQS) report — output vs input for a period
      responses: { '200': { description: VAT report } }
  /finance/vat/settle:
    post:
      tags: [finance]
      summary: Settle VAT for a period (posts the settlement entry)
      responses: { '201': { description: Settled } }

