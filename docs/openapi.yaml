              properties:
                brandName: { type: string, nullable: true }
                brandColor: { type: string, pattern: '^#[0-9a-fA-F]{6}$', nullable: true }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /tenant/modules/{key}:
    patch:
      tags: [tenant]
      summary: Enable/disable a module (plan quota enforced)
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties: { enabled: { type: boolean } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ==================== BILLING ====================
  /billing/plans:
    get:
      tags: [billing]
      summary: List subscription plans
      responses: { '200': { description: Plans } }
  /billing/subscription:
    get:
      tags: [billing]
      summary: Current subscription, limits and usage
      responses: { '200': { description: Subscription } }
  /billing/subscribe:
    post:
      tags: [billing]
      summary: Create an invoice for a paid plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, enum: [starter, business] }
                method: { type: string, enum: [bank_transfer, card], default: bank_transfer }
      responses: { '201': { description: Invoice created } }
  /billing/pay:
    post:
      tags: [billing]
      summary: Pay an invoice by card (sandbox) and activate the plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceId]
              properties:
                invoiceId: { type: string }
                method: { type: string, enum: [card, mock, payme, click, stripe], default: card }
      responses: { '200': { description: Activated } }

  # ==================== ADMIN ====================
  /admin/users:
    get:
      tags: [admin]
      summary: List tenant users
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/search'
      responses: { '200': { description: Users } }
    post:
      tags: [admin]
      summary: Create a user with role codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName, password]
              properties:
                email: { type: string, format: email }
                fullName: { type: string }
                password: { type: string, minLength: 6 }
                roleCodes:
                  type: array
                  items: { type: string }
      responses: { '201': { description: Created } }
  /admin/roles:
    get:
      tags: [admin]
      summary: List roles with permissions
      responses: { '200': { description: Roles } }
    post:
      tags: [admin]
      summary: Create a custom role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, permissions]
              properties:
                code: { type: string }
                name: { type: string }
                description: { type: string }
                permissions:
                  type: array
                  items: { type: string }
      responses: { '201': { description: Created } }
  /admin/invitations:
    get:
      tags: [admin]
      summary: List pending invitations
      responses: { '200': { description: Invitations } }
    post:
      tags: [admin]
      summary: Invite a user by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, roleCodes]
              properties:
                email: { type: string, format: email }
                roleCodes:
                  type: array
                  items: { type: string }
      responses: { '201': { description: Invitation created } }
  /admin/audit:
    get:
      tags: [admin]
      summary: Audit log (who / what / when)
      parameters:
        - $ref: '#/components/parameters/page'
      responses: { '200': { description: Audit entries } }
  /admin/permissions:
    get:
      tags: [admin]
      summary: Global permission catalog
      responses: { '200': { description: Permissions } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from POST /auth/login, sent as `Authorization: Bearer <token>`.'
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Developer API key (ttr_live_…) created in the app under Управление → API-ключи. Recommended for server-to-server integrations. May also be sent as `Authorization: Bearer ttr_live_…`.'

  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    sort:
      name: sort
      in: query
      schema: { type: string }
    order:
      name: order
      in: query
      schema: { type: string, enum: [asc, desc] }
    search:
      name: search
      in: query
      schema: { type: string }

  responses:
    Ok:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties: { ok: { type: boolean, example: true } }
    ValidationError:
      description: Validation or business-rule error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials/token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Unique constraint / duplicate
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
            details: { type: object, nullable: true }
    PageMeta:
      type: object
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        tenant: { type: string, description: 'Slug, when the email exists in multiple tenants' }
        mfaCode: { type: string }
    RegisterRequest:
      type: object
      required: [companyName, fullName, email, password]
      properties:
        companyName: { type: string }
        industry: { type: string, description: 'Niche key, e.g. manufacturing, retail' }
        fullName: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        plan: { type: string }
        modules:
          type: array
          items: { type: string }
        bill: { type: object, description: 'Optional legal/billing requisites' }
    AuthResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tenant:
          type: object
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        fullName: { type: string }
        tenantId: { type: string }
        roles:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        platformAdmin: { type: boolean }
    Product:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        type: { type: string, enum: [stockable, service] }
        categoryId: { type: string, nullable: true }
        unitId: { type: string, nullable: true }
        priceMinor:
          type: integer
          nullable: true
          description: 'Price in minor units (tiyin); null when the caller lacks catalog.price'
        currency: { type: string }
        barcode: { type: string, nullable: true }
        tracking: { type: string, enum: [none, batch, serial], nullable: true }
    ProductInput:
      type: object
      required: [sku, name]
      properties:
        sku: { type: string }
        name: { type: string }
        type: { type: string, enum: [stockable, service], default: stockable }
        categoryId: { type: string }
        unitId: { type: string }
        priceMinor: { type: integer, default: 0, description: 'Minor units (tiyin)' }
        currency: { type: string, default: UZS }
        barcode: { type: string }
        tracking: { type: string, enum: [none, batch, serial] }
    StockRow:
      type: object
      properties:
        warehouseId: { type: string }
        warehouse: { type: string }
        productId: { type: string }
        sku: { type: string }
        product: { type: string }
        unit: { type: string }
        quantity: { type: string }
        reserved: { type: string }
        available: { type: string }
    OrderLineInput:
      type: object
      required: [productId, quantity, priceMinor]
      properties:
        productId: { type: string }
        quantity: { type: number }
        priceMinor: { type: integer, description: 'Unit price in minor units' }
        discountPct: { type: integer, minimum: 0, maximum: 100, default: 0 }
    PartyInput:
      type: object
      description: Customer or supplier
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
        legalName: { type: string }
        inn: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        bank: { type: string }
        account: { type: string }
        mfo: { type: string }
        rating: { type: integer, minimum: 0, maximum: 5 }
        notes: { type: string }
    FormField:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { type: string }
        type: { type: string, enum: [text, textarea, number, date, select, checkbox], default: text }
        required: { type: boolean, default: false }
        options:
          type: array
          items: { type: string }
